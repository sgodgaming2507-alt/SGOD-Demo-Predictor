
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12071f">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<title>S_GOD Number Simulator</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:15px;color:white;
 font-family:Arial,sans-serif;background:
 radial-gradient(ellipse at top,#35135b,transparent 50%),
 radial-gradient(ellipse at bottom,#081d44,transparent 50%),#05030b;
}
.app{max-width:480px;margin:auto}
.header{
 text-align:center;padding:20px 12px;border:1px solid #9b4dff;
 border-radius:20px;background:linear-gradient(145deg,#1b0d2c,#080610);
 box-shadow:0 0 20px #852aff35;
}
.logo{font-size:38px;font-weight:900;font-style:italic;color:#d1a2ff;text-shadow:0 0 18px #a000ff}
.sub{font-size:11px;letter-spacing:3px;color:#b6a0d5;margin-top:5px}
.tag{display:inline-block;margin-top:15px;padding:8px 15px;background:#281542;color:#d5aaff;border:1px solid #8e40ff;border-radius:30px;font-size:11px}
.panel{background:linear-gradient(145deg,#151020,#08070d);border:1px solid #7835be;border-radius:17px;padding:17px;margin-top:15px;box-shadow:0 0 15px #7d20cf18}
.label{text-align:center;color:#b88aff;font-size:12px;letter-spacing:2px}
.round{text-align:center;font-size:23px;font-weight:bold;margin-top:12px}
.timer-wrap{display:flex;justify-content:center;margin:20px 0}
.timer{width:175px;height:175px;border-radius:50%;border:7px solid #7124c9;outline:3px solid #281449;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 0 25px #902eff55,inset 0 0 25px #671cba33}
.timer-caption{font-size:11px;color:#bd93ff;letter-spacing:2px}
.time{font-size:43px;font-weight:900;margin:7px 0}
.result{text-align:center;padding:22px 10px;border-radius:15px;background:linear-gradient(145deg,#170b28,#07060d);border:1px solid #9b45ff;margin-top:14px}
.number{font-size:100px;font-weight:900;line-height:1.1;color:#d9a5ff;text-shadow:0 0 24px #9900ff}
.caption{font-size:11px;color:#a98bd3;letter-spacing:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.status{background:#0d0b14;border:1px solid #36214e;border-radius:12px;padding:13px;text-align:center}
.stitle{font-size:10px;color:#9f85c5;letter-spacing:1px}
.svalue{font-weight:bold;color:#c98aff;margin-top:7px;font-size:13px}
.history-title{font-size:12px;color:#c38cff;letter-spacing:2px}
.history{margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 5px;border-bottom:1px solid #241a31;font-size:12px}
.hnum{font-size:22px;font-weight:bold;color:#d7aaff}
.footer{text-align:center;padding:20px;color:#795b9b;font-size:11px;letter-spacing:2px}
.note{text-align:center;color:#76658e;font-size:10px;margin-top:10px}
</style>
</head>

<body>
<div class="app">

<div class="header">
 <div class="logo">S_GOD</div>
 <div style="font-size:20px;font-weight:bold">NUMBER SIMULATOR</div>
 <div class="sub">NEON EDITION</div>
 <div class="tag">● RANDOM DEMO MODE</div>
</div>

<div class="panel">
 <div class="label">DEMO ROUND</div>
 <div class="round" id="round">0001</div>
</div>

<div class="timer-wrap">
 <div class="timer">
  <div class="timer-caption">TIME LEFT</div>
  <div class="time" id="timer">01:00</div>
  <div class="timer-caption">SECONDS</div>
 </div>
</div>

<div class="panel">
 <div class="label">RANDOM NUMBER</div>
 <div class="result">
  <div class="number" id="number">0</div>
  <div class="caption">SIMULATED VALUE • 0–9</div>
 </div>
 <div class="grid">
  <div class="status">
   <div class="stitle">SYSTEM</div>
   <div class="svalue">READY</div>
  </div>
  <div class="status">
   <div class="stitle">MODE</div>
   <div class="svalue">SIMULATION</div>
  </div>
 </div>
</div>

<div class="panel">
 <div class="history-title">◈ RECENT DEMO NUMBERS</div>
 <div class="history" id="history"></div>
</div>

<div class="footer">POWERED BY S_GOD</div>
<div class="note">Random simulation only • No real-world predictions</div>

</div>

<script>
const ROUND_SECONDS = 60;
let remaining = ROUND_SECONDS;
let round = 1;
let historyData = [];

const timerEl = document.getElementById("timer");
const numberEl = document.getElementById("number");
const roundEl = document.getElementById("round");
const historyEl = document.getElementById("history");

function updateTimer(){
 const mins = String(Math.floor(remaining/60)).padStart(2,"0");
 const secs = String(remaining%60).padStart(2,"0");
 timerEl.textContent = mins + ":" + secs;
}

function randomDemoNumber(){
 return Math.floor(Math.random()*10);
}

function newRound(){
 round++;
 remaining = ROUND_SECONDS;
 roundEl.textContent = String(round).padStart(4,"0");

 const n = randomDemoNumber();
 numberEl.textContent = n;

 historyData.unshift({round,number:n});
 historyData = historyData.slice(0,10);
 renderHistory();
 updateTimer();
}

function renderHistory(){
 historyEl.innerHTML = "";

 historyData.forEach(item=>{
  const row = document.createElement("div");
  row.className = "row";

  const left = document.createElement("span");
  left.textContent = "ROUND " + String(item.round).padStart(4,"0");

  const right = document.createElement("span");
  right.className = "hnum";
  right.textContent = item.number;

  row.append(left,right);
  historyEl.appendChild(row);
 });
}

roundEl.textContent = String(round).padStart(4,"0");
numberEl.textContent = randomDemoNumber();
updateTimer();

setInterval(()=>{
 remaining--;
 if(remaining <= 0){
  newRound();
 }else{
  updateTimer();
 }
},1000);

// Offline cache registration
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .then(()=>console.log("Offline demo ready"))
   .catch(err=>console.log("Offline setup:",err));
 });
}
</script>

</body>
</html>
